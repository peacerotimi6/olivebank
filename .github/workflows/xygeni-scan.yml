name: Olive Bank - Xygeni Security Scan

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'App/**'
      - '.github/workflows/xygeni-scan.yml'

permissions:
  contents: read

jobs:
  xygeni-security-scan:
    name: Xygeni Software Supply Chain Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Xygeni credentials
        shell: bash
        env:
          XYGENI_TOKEN: ${{ secrets.XYGENI_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$XYGENI_TOKEN" ]; then
            echo "::error::Missing GitHub secret XYGENI_TOKEN"
            exit 1
          fi

          echo "Xygeni API token is configured."

      - name: Run Xygeni Security Scanner
        uses: xygeni/xygeni-action@v6.4.0
        id: xygeni-scan
        with:
          token: ${{ secrets.XYGENI_TOKEN }}
          command: scan --never-fail -d .
