name: Build and Deploy OliveBank Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'App/frontend/**'
      - '.github/workflows/frontend.deployment.yaml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: olive-bank-frontend-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_NAME: ${{ vars.FRONTEND_IMAGE_NAME }}
      WEBAPP_NAME: ${{ vars.FRONTEND_WEBAPP_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ACR_NAME \
            ACR_LOGIN_SERVER \
            IMAGE_NAME \
            WEBAPP_NAME \
            RESOURCE_GROUP
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions variable: $name"
              exit 1
            fi
          done

          if [ ! -f App/frontend/Dockerfile ]; then
            echo "::error::Dockerfile not found at App/frontend/Dockerfile"
            exit 1
          fi

          echo "Configuration validated."

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing Web App
        shell: bash
        run: |
          set -euo pipefail

          az webapp show \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name,state:state,host:defaultHostName}" \
            --output table

      - name: Check App Service container configuration
        shell: bash
        run: |
          set -euo pipefail

          az webapp sitecontainers list \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output json

      - name: Log in to ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

      - name: Build frontend image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --platform linux/amd64 \
            --file App/frontend/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            App/frontend

      - name: Push image to ACR
        shell: bash
        run: |
          set -euo pipefail
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      - name: Configure App Service container
        shell: bash
        run: |
          set -euo pipefail

          az webapp sitecontainers update \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name main \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --target-port 80 \
            --is-main true

      - name: Restart App Service
        shell: bash
        run: |
          set -euo pipefail

          az webapp restart \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          HOST=$(az webapp show \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query defaultHostName \
            --output tsv)

          SITE_URL="https://$HOST/"

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --output /dev/null "$SITE_URL"; then
              echo "Frontend is serving at $SITE_URL"
              echo "Deployed image: $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
              exit 0
            fi

            echo "Attempt $attempt/18: waiting for frontend startup..."
            sleep 10
          done

          echo "::error::Frontend check failed at $SITE_URL"
          exit 1