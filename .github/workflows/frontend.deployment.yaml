name: Build and Deploy OliveBank Backend

on:
  push:
    branches:
      - main
    paths:
      - 'App/backend/**'
      - '.github/workflows/backend.deployment.yaml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: olive-bank-backend-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_NAME: ${{ vars.BACKEND_IMAGE_NAME }}
      WEBAPP_NAME: ${{ vars.BACKEND_WEBAPP_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ACR_NAME \
            ACR_LOGIN_SERVER \
            IMAGE_NAME \
            WEBAPP_NAME \
            RESOURCE_GROUP
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions variable: $name"
              exit 1
            fi
          done

          if [ ! -f App/backend/Dockerfile ]; then
            echo "::error::Dockerfile not found at App/backend/Dockerfile"
            exit 1
          fi

          echo "Deployment configuration validated."

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing backend Web App
        shell: bash
        run: |
          set -euo pipefail

          az webapp show \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name,state:state,host:defaultHostName}" \
            --output table

      - name: Check backend container configuration
        shell: bash
        run: |
          set -euo pipefail

          az webapp sitecontainers list \
            --name "$WEB