
name: Build and Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'App/backend/**'
      - '.github/workflows/backend.deployment.yaml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: olive-bank-backend-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_NAME: ${{ vars.BACKEND_IMAGE_NAME }}
      WEBAPP_NAME: ${{ vars.BACKEND_WEBAPP_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ACR_NAME \
            ACR_LOGIN_SERVER \
            IMAGE_NAME \
            WEBAPP_NAME \
            RESOURCE_GROUP
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions variable: $name"
              exit 1
            fi
          done

          if [ "$WEBAPP_NAME" != "olive-bank-backend" ]; then
            echo "::error::Unexpected backend Web App name: $WEBAPP_NAME"
            exit 1
          fi

          if [ ! -f App/backend/Dockerfile ]; then
            echo "::error::App/backend/Dockerfile was not found."
            exit 1
          fi

          if [ ! -f App/backend/pom.xml ]; then
            echo "::error::App/backend/pom.xml was not found."
            exit 1
          fi

          echo "Registry: $ACR_LOGIN_SERVER"
          echo "Image: $IMAGE_NAME:$IMAGE_TAG"
          echo "Web App: $WEBAPP_NAME"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: App/backend/pom.xml

      - name: Build backend JAR
        shell: bash
        run: |
          set -euo pipefail
          cd App/backend

          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw -B -DskipTests package
          else
            mvn -B -DskipTests package
          fi

          if ! compgen -G "target/*.jar" > /dev/null; then
            echo "::error::No JAR was produced in App/backend/target."
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify backend Web App exists
        shell: bash
        run: |
          set -euo pipefail

          az webapp show \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name,state:state,host:defaultHostName}" \
            --output table

      - name: Log in to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

      - name: Build backend Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --platform linux/amd64 \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --file App/backend/Dockerfile \
            App/backend

      - name: Push backend Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      - name: Verify existing backend site container
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER_NAME="olivebank-dev-backend"

          CONTAINER_COUNT=$(az webapp sitecontainers list \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='$CONTAINER_NAME' && isMain==\`true\`].name | length(@)" \
            --output tsv)

          if [ "$CONTAINER_COUNT" != "1" ]; then
            echo "::error::Expected exactly one existing main container named $CONTAINER_NAME."
            echo "::error::No container was changed."
            exit 1
          fi

          echo "Verified existing main container: $CONTAINER_NAME"

      - name: Update existing backend container
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          CONTAINER_NAME="olive-bank-backend"

          az webapp sitecontainers update \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name "$CONTAINER_NAME" \
            --image "$IMAGE" \
            --target-port 8081

          echo "Updated existing backend container to $IMAGE"

      - name: Restart backend Web App
        shell: bash
        run: |
          set -euo pipefail

          az webapp restart \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP"

      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail

          HOST=$(az webapp show \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query defaultHostName \
            --output tsv)

          HEALTH_URL="https://$HOST/actuator/health"

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$HEALTH_URL"; then
              echo
              echo "Backend health check passed."
              exit 0
            fi

            echo "Attempt $attempt/18: waiting for backend startup..."
            sleep 10
          done

          echo "::error::Backend health check failed at $HEALTH_URL"
          exit 1
