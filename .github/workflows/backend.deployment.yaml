
name: Build and Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'App/backend/**'
      - '.github/workflows/backend.deployment.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: olive-bank-backend-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_NAME: ${{ vars.BACKEND_IMAGE_NAME }}
      WEBAPP_NAME: ${{ vars.BACKEND_WEBAPP_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ACR_NAME \
            ACR_LOGIN_SERVER \
            IMAGE_NAME \
            WEBAPP_NAME \
            RESOURCE_GROUP
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions variable: $name"
              exit 1
            fi
          done

          if [ ! -f App/backend/Dockerfile ]; then
            echo "::error::App/backend/Dockerfile was not found."
            exit 1
          fi

          echo "Deployment configuration validated."
          echo "Registry: $ACR_LOGIN_SERVER"
          echo "Image: $IMAGE_NAME:$IMAGE_TAG"
          echo "Web App: $WEBAPP_NAME"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify backend Web App exists
        shell: bash
        run: |
          set -euo pipefail

          az webapp show \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name,state:state,host:defaultHostName}" \
            --output table

      - name: Log in to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

      - name: Build backend Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --platform linux/amd64 \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --file App/backend/Dockerfile \
            App/backend

      - name: Push backend Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      - name: Configure backend Web App container
        shell: bash
        run: |
          set -euo pipefail

          az webapp config set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --linux-fx-version "DOCKER|$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          az webapp config appsettings set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings WEBSITES_PORT=8080

      - name: Restart backend Web App
        shell: bash
        run: |
          set -euo pipefail

          az webapp restart \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP"

      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_URL="https://$(az webapp show \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query defaultHostName \
            --output tsv)/actuator/health"

          echo "Checking backend health at $HEALTH_URL"

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$HEALTH_URL"; then
              echo
              echo "Backend health check passed."
              exit 0
            fi

            echo "Attempt $attempt/18: backend is starting. Waiting 10 seconds..."
            sleep 10
          done

          echo "::error::Backend health check failed."
          exit 1
