
name: Manual Security Scans & Email Alert

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  security-scan:
    name: Olive Bank Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      BACKEND_IMAGE_NAME: ${{ vars.BACKEND_IMAGE_NAME }}
      FRONTEND_IMAGE_NAME: ${{ vars.FRONTEND_IMAGE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GitHub configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_BACKEND_PROJECT_KEY: ${{ secrets.SONAR_BACKEND_PROJECT_KEY }}
          SONAR_FRONTEND_PROJECT_KEY: ${{ secrets.SONAR_FRONTEND_PROJECT_KEY }}
        run: |
          set -euo pipefail

          for name in \
            ACR_NAME \
            ACR_LOGIN_SERVER \
            BACKEND_IMAGE_NAME \
            FRONTEND_IMAGE_NAME \
            SONAR_TOKEN \
            SONAR_ORGANIZATION \
            SONAR_BACKEND_PROJECT_KEY \
            SONAR_FRONTEND_PROJECT_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing configuration: $name"
              exit 1
            fi
          done

          echo "Configuration validation passed."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Retrieve frontend and backend image tags
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND_TAG=$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$FRONTEND_IMAGE_NAME" \
            --orderby time_desc \
            --top 1 \
            --output tsv)

          BACKEND_TAG=$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$BACKEND_IMAGE_NAME" \
            --orderby time_desc \
            --top 1 \
            --output tsv)

          if [ -z "$FRONTEND_TAG" ]; then
            echo "::error::No frontend image found in ACR."
            exit 1
          fi

          if [ -z "$BACKEND_TAG" ]; then
            echo "::error::No backend image found in ACR."
            exit 1
          fi

          echo "frontend_tag=$FRONTEND_TAG" >> "$GITHUB_OUTPUT"
          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"

          echo "Frontend image tag retrieved successfully."
          echo "Backend image tag retrieved successfully."

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.image-tags.outputs.backend_tag }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.image-tags.outputs.frontend_tag }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM

      - name: Build backend for SonarCloud analysis
        run: |
          cd App/backend
          mvn --batch-mode clean verify -DskipTests

      - name: SonarCloud backend scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: App/backend
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_BACKEND_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

      - name: SonarCloud frontend scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: App/frontend
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_FRONTEND_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

      - name: Send security scan email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Olive Bank - Security Scan Workflow Result: ${{ job.status }}"
          from: ${{ secrets.SECURITY_ALERT_EMAIL_FROM }}
          to: ${{ secrets.SECURITY_ALERT_EMAIL_TO }}
          body: |
            Olive Bank security workflow has finished.

            Overall workflow status: ${{ job.status }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Frontend image tag: ${{ steps.image-tags.outputs.frontend_tag }}
            Backend image tag: ${{ steps.image-tags.outputs.backend_tag }}

            Review the workflow logs for Trivy and SonarCloud results:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
