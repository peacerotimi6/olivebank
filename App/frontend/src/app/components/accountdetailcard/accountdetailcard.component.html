
<div class="p-4 bg-blue-500 rounded-lg shadow-lg text-white">

  <div class="mb-6 flex items-center gap-3">
    <h2 class="text-3xl font-semibold text-yellow-400">
      <ng-container *ngIf="showBalance; else hiddenBalance">
        {{ accountDetails?.balance | currency:'GBP':'symbol':'1.2-2' }}
      </ng-container>

      <ng-template #hiddenBalance>
        £••••••
      </ng-template>
    </h2>

    
<button
  type="button"
  (click)="toggleBalance()"
  class="rounded p-2 text-white hover:bg-blue-600 flex items-center justify-center"
  [attr.aria-label]="showBalance ? 'Hide account balance' : 'Show account balance'"
  [attr.title]="showBalance ? 'Hide balance' : 'Show balance'">

  <svg
    *ngIf="showBalance"
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true">
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>

  <svg
    *ngIf="!showBalance"
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true">
    <path d="M3 3l18 18"/>
    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
    <path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a13 13 0 0 1-3.1 3.8"/>
    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.3 3.5-.7"/>
  </svg>

</button>

  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="mb-4">
      <label for="accountNumber" class="block text-sm font-bold">
        Account Number:
      </label>
      <span id="accountNumber" class="font-bold text-base">
        {{ accountDetails?.accountNumber }}
      </span>
    </div>

    <div class="mb-4">
      <label for="accountType" class="block text-sm font-bold">
        Account Type:
      </label>
      <span id="accountType" class="font-bold text-base">
        {{ accountDetails?.accountType }}
      </span>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="mb-4">
      <label for="branch" class="block text-sm font-bold">
        Branch:
      </label>
      <span id="branch" class="font-bold text-base">
        {{ accountDetails?.branch }}
      </span>
    </div>

    <div class="mb-4">
      <label for="sortCode" class="block text-sm font-bold">
        Sort Code:
      </label>
      <span id="sortCode" class="font-bold text-base">
        {{ accountDetails?.sortCode }}
      </span>
    </div>
  </div>

</div>
