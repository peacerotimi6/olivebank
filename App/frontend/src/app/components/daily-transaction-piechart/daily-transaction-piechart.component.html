
<div class="bg-white rounded-lg overflow-hidden px-6 py-4 card">
  <div class="mb-2">
    <h4 class="text-lg font-semibold text-gray-800">
      Daily Transaction Chart
    </h4>

    <div class="flex mb-2">
      <input
        type="date"
        id="selectedDate"
        [(ngModel)]="selectedDate"
        (ngModelChange)="updateChart()"
        class="flex-grow border rounded py-2 px-3 text-gray-700"
        aria-label="Select date"
      />
    </div>
  </div>

  <div>
    <canvas
      *ngIf="pieChartData.datasets[0].data.length > 0"
      class="w-full !h-[205px] border border-gray-300 rounded-lg"
      baseChart
      [data]="pieChartData"
      [options]="pieChartOptions"
      [type]="pieChartType"
    ></canvas>

    <div
      *ngIf="pieChartData.datasets[0].data.length === 0"
      class="w-full rounded-lg border border-gray-200 bg-gray-50 p-6 text-center"
    >
      <p class="font-semibold text-gray-700">
        No transactions for this date
      </p>
      <p class="mt-1 text-sm text-gray-500">
        Choose another date or make a transaction to see your activity.
      </p>
    </div>
  </div>
</div>
