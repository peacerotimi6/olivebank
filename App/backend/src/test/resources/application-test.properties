# Test Database Configuration - Local MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/olive_bank_test?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=olive_test
spring.datasource.password=${TEST_DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# SQL Initialization
spring.sql.init.mode=always

# Spring Configuration
spring.main.allow-circular-references=true
server.error.include-message=always

# HikariCP Test Pool Settings
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=5
